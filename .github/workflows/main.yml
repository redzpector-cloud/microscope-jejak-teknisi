name: Build Jejak Teknisi Microscope

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jejak-teknisi-microscope-v3.8.3-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
